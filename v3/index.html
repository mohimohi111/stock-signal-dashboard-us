<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自動売買</title>
<meta name="description" content="IBKR本番口座の実際の保有・注文・約定・純資産の推移">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0b0f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:            #0b0f17;
    --bg-2:          #0f1522;
    --surface:       rgba(255,255,255,0.045);
    --surface-hi:    rgba(255,255,255,0.08);
    --border:        rgba(255,255,255,0.09);
    --border-hi:     rgba(255,255,255,0.18);
    --text:          #e9edf5;
    --text-2:        #aab3c5;
    --muted:         #6f7a90;
    --profit:        #5aa0ff;
    --profit-soft:   rgba(90,160,255,0.16);
    --loss:          #ff5e7d;
    --loss-soft:     rgba(255,94,125,0.16);
    --amber:         #ffb62e;
    --green:         #35d07f;
    --mode-a:        #35d07f;
    --mode-b:        #ffb62e;
    --mode-c:        #ff5e7d;
    --glow:          rgba(90,160,255,0.35);
    --shadow:        0 10px 30px rgba(0,0,0,0.35);
    --radius:        18px;
    --mono:          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:          "Inter", "Noto Sans JP", -apple-system, "Hiragino Sans", sans-serif;
  }
  :root[data-theme="light"], :root:not([data-theme="dark"]) { }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg:          #f4f6fa;
      --bg-2:        #ffffff;
      --surface:     rgba(255,255,255,0.82);
      --surface-hi:  rgba(255,255,255,0.98);
      --border:      rgba(16,24,40,0.09);
      --border-hi:   rgba(16,24,40,0.2);
      --text:        #0e1320;
      --text-2:      #3d4760;
      --muted:       #7b8499;
      --profit:      #2068d8;
      --profit-soft: rgba(32,104,216,0.12);
      --loss:        #d6304f;
      --loss-soft:   rgba(214,48,79,0.12);
      --amber:       #b7780a;
      --green:       #15994f;
      --mode-a:      #15994f;
      --mode-b:      #b7780a;
      --mode-c:      #d6304f;
      --glow:        rgba(32,104,216,0.22);
      --shadow:      0 10px 30px rgba(16,24,40,0.08);
    }
  }
  :root[data-theme="light"] {
      color-scheme: light;
      --bg:          #f4f6fa;
      --bg-2:        #ffffff;
      --surface:     rgba(255,255,255,0.82);
      --surface-hi:  rgba(255,255,255,0.98);
      --border:      rgba(16,24,40,0.09);
      --border-hi:   rgba(16,24,40,0.2);
      --text:        #0e1320;
      --text-2:      #3d4760;
      --muted:       #7b8499;
      --profit:      #2068d8;
      --profit-soft: rgba(32,104,216,0.12);
      --loss:        #d6304f;
      --loss-soft:   rgba(214,48,79,0.12);
      --amber:       #b7780a;
      --green:       #15994f;
      --mode-a:      #15994f;
      --mode-b:      #b7780a;
      --mode-c:      #d6304f;
      --glow:        rgba(32,104,216,0.22);
      --shadow:      0 10px 30px rgba(16,24,40,0.08);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    padding: max(14px, env(safe-area-inset-top)) 16px 56px;
    max-width: 760px; margin: 0 auto; position: relative;
    font-feature-settings: "tnum" 1, "cv11" 1;
  }
  a { color: var(--profit); }

  /* ---------- 背景 ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(90,160,255,0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(53,208,127,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }
  .sky .grid {
    position: absolute; inset: -1px;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 70%);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 70%);
  }
  .sky .glow {
    position: absolute; width: 140%; height: 140%; left: -20%; top: -20%;
    background: radial-gradient(circle at 25% 20%, var(--glow), transparent 38%);
    filter: blur(24px); opacity: 0.8;
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift { to { transform: translate(-5%, 4%) scale(1.08); } }
  .sky .bolt {
    position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(circle at var(--bx,50%) var(--by,0%), rgba(255,255,255,var(--bi,0.7)), rgba(255,255,255,0) 50%);
  }
  .sky.flash .bolt { animation: bolt var(--bdur,500ms) ease-out; }
  @keyframes bolt { 0%{opacity:0} 8%{opacity:1} 16%{opacity:.1} 26%{opacity:.8} 40%,100%{opacity:0} }
  @media (prefers-reduced-motion: reduce) { .sky .glow { animation: none; } .sky .bolt { display: none; } }
  #app { position: relative; z-index: 1; display: none; }

  /* ---------- ヘッダー ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0; white-space: nowrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-hi);
    background: var(--surface); letter-spacing: 0.04em; white-space: nowrap;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.on { color: var(--green); border-color: color-mix(in srgb, var(--green) 50%, transparent); }
  .pill.on .dot { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .pill.off { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 50%, transparent); }
  .pill.off .dot { background: var(--loss); }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(1.5)} }
  .actions { display: flex; gap: 6px; }
  .ibtn {
    appearance: none; background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
    width: 36px; height: 36px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
  }
  .ibtn:hover { background: var(--surface-hi); border-color: var(--border-hi); color: var(--text); }
  .ibtn:active { transform: scale(0.94); }
  .ibtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ibtn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  /* ---------- カード共通 ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow); position: relative; overflow: hidden;
    animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    opacity: 0.6; pointer-events: none;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .banner { border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 13px; font-weight: 600; line-height: 1.6; }
  .banner.warn { background: color-mix(in srgb, var(--amber) 14%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 50%, transparent); color: var(--amber); }
  .banner.err { background: var(--loss-soft); border: 1px solid color-mix(in srgb, var(--loss) 55%, transparent); color: var(--loss); }
  .banner .sub { display: block; font-weight: 400; color: var(--text-2); font-size: 12px; margin-top: 4px; }

  /* ---------- ヒーロー ---------- */
  .hero .label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .hero .big { font-family: var(--mono); font-size: clamp(32px, 9vw, 44px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin: 4px 0 8px; }
  .hero .big .cur { font-size: 0.55em; color: var(--muted); margin-right: 4px; font-weight: 500; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    font-family: var(--mono); font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px;
    background: var(--surface-hi); border: 1px solid var(--border); color: var(--text-2);
  }
  .chip small { font-family: var(--sans); font-weight: 500; color: var(--muted); margin-right: 5px; }
  .chip.up { color: var(--profit); background: var(--profit-soft); border-color: color-mix(in srgb, var(--profit) 35%, transparent); }
  .chip.down { color: var(--loss); background: var(--loss-soft); border-color: color-mix(in srgb, var(--loss) 35%, transparent); }
  .chart { position: relative; margin: 6px -4px 0; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--mono); }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--profit); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px var(--glow)); }
  .chart .area { fill: url(#eqGrad); }
  .chart .last { fill: var(--profit); stroke: var(--bg); stroke-width: 2; }
  .chart .last-halo { fill: var(--profit); opacity: .25; animation: halo 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes halo { 0%{transform:scale(1);opacity:.35} 100%{transform:scale(3);opacity:0} }
  .chart .cursor { stroke: var(--border-hi); stroke-dasharray: 3 3; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 5;
    background: var(--text); color: var(--bg); font-family: var(--mono); font-size: 11px; font-weight: 700;
    padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -125%);
  }
  .range { display: flex; gap: 4px; margin-top: 8px; }
  .range button {
    appearance: none; background: transparent; border: 1px solid transparent; color: var(--muted);
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 7px; cursor: pointer; font-family: var(--mono);
  }
  .range button.on { background: var(--surface-hi); border-color: var(--border); color: var(--text); }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { padding: 12px 14px; margin: 0; animation-delay: .05s; }
  .kpi .label { font-size: 11px; color: var(--muted); font-weight: 600; }
  .kpi .val { font-family: var(--mono); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; white-space: nowrap; }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .up { color: var(--profit); } .down { color: var(--loss); }

  /* ---------- セクション ---------- */
  section { margin: 18px 0 8px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 8px; }
  .sec-h h2 { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); margin: 0; }
  .sec-h .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .sort { display: flex; gap: 4px; }
  .sort button { appearance: none; background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 7px; cursor: pointer; }
  .sort button.on { color: var(--text); background: var(--surface-hi); border-color: var(--border-hi); }
  .empty { text-align: center; color: var(--muted); padding: 22px 14px; font-size: 13px; }

  /* ---------- 建玉 ---------- */
  .pos-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 620px) { .pos-grid { grid-template-columns: 1fr 1fr; } }
  .pos { margin: 0; padding: 14px 15px 13px; }
  .pos.up { border-color: color-mix(in srgb, var(--profit) 30%, var(--border)); }
  .pos.down { border-color: color-mix(in srgb, var(--loss) 30%, var(--border)); }
  .pos-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .sym { font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
  .nm { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .modes { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
  .mode { font-family: var(--mono); font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px; border: 1px solid; letter-spacing: .03em; }
  .mode.a { color: var(--mode-a); border-color: color-mix(in srgb, var(--mode-a) 55%, transparent); background: color-mix(in srgb, var(--mode-a) 14%, transparent); }
  .mode.b { color: var(--mode-b); border-color: color-mix(in srgb, var(--mode-b) 55%, transparent); background: color-mix(in srgb, var(--mode-b) 14%, transparent); }
  .mode.c { color: var(--mode-c); border-color: color-mix(in srgb, var(--mode-c) 55%, transparent); background: color-mix(in srgb, var(--mode-c) 14%, transparent); }
  .pnl { text-align: right; }
  .pnl .pct { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .pnl .usd { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .track { position: relative; height: 6px; border-radius: 3px; margin: 12px 0 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--loss) 55%, transparent), var(--border) 45%, color-mix(in srgb, var(--profit) 55%, transparent)); }
  .track .m { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg); }
  .track .m.sl { background: var(--loss); }
  .track .m.cost { background: var(--text-2); width: 2px; height: 14px; border-radius: 1px; border: 0; }
  .track .m.last { background: var(--profit); box-shadow: 0 0 8px var(--profit); z-index: 1; }
  .track .m.last.neg { background: var(--loss); box-shadow: 0 0 8px var(--loss); }
  .trk-lbl { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .trk-lbl b { color: var(--text-2); font-weight: 600; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; font-size: 11px; }
  .facts .k { color: var(--muted); font-size: 10px; }
  .facts .v { font-family: var(--mono); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .warn-sl { color: var(--loss); font-weight: 700; }

  /* ---------- 指値 ---------- */
  .ord { margin: 0 0 8px; padding: 12px 15px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
  .ord .gap { font-family: var(--mono); font-size: 16px; font-weight: 700; text-align: right; }
  .ord .gap small { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
  .ord .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .ord .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mode-b), var(--profit)); border-radius: 2px; }
  .ord .line { grid-column: 1 / -1; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .ord .line b { color: var(--text-2); font-weight: 600; }

  /* ---------- 約定 ---------- */
  .day { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 700; margin: 10px 4px 4px; letter-spacing: .04em; }
  .fill { margin: 0 0 6px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .fill .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 800; font-family: var(--mono); flex-shrink: 0; }
  .fill .ic.buy { background: var(--profit-soft); color: var(--profit); }
  .fill .ic.win { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
  .fill .ic.lose { background: var(--loss-soft); color: var(--loss); }
  .fill .body { flex: 1; min-width: 0; }
  .fill .t { font-weight: 700; font-size: 13px; }
  .fill .t .nm2 { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 4px; }
  .fill .d { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .fill .r { text-align: right; font-family: var(--mono); white-space: nowrap; }
  .fill .r .p { font-weight: 700; font-size: 13.5px; }
  .fill .r .s { font-size: 10.5px; color: var(--muted); }

  details.fold > summary { list-style: none; cursor: pointer; user-select: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary .sec-h h2::after { content: "▸"; margin-left: 6px; color: var(--muted); display: inline-block; transition: transform .15s; }
  details.fold[open] > summary .sec-h h2::after { transform: rotate(90deg); }

  footer { margin-top: 28px; text-align: center; font-size: 11.5px; color: var(--muted); line-height: 1.9; }
  footer a { color: var(--text-2); text-decoration: none; border-bottom: 1px solid var(--border-hi); }

  /* ---------- ゲート ---------- */
  .gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); }
  .gate .box { width: 100%; max-width: 340px; text-align: center; padding: 28px 22px; }
  .gate h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 4px; }
  .gate .sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; letter-spacing: .1em; }
  .gate input {
    width: 100%; background: var(--surface-hi); color: var(--text); border: 1px solid var(--border-hi); border-radius: 12px;
    padding: 13px 14px; font-size: 16px; text-align: center; margin-bottom: 10px; font-family: var(--mono); outline: none;
  }
  .gate input:focus { border-color: var(--profit); box-shadow: 0 0 0 3px var(--profit-soft); }
  .gate button { width: 100%; background: var(--profit); color: #fff; border: 0; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .gate .err { color: var(--loss); font-size: 12px; margin-top: 10px; min-height: 1.4em; }
</style>
</head>
<body>
<div class="sky" id="sky"><div class="grid"></div><div class="glow"></div><div class="bolt"></div></div>

<div class="gate" id="gate">
  <div class="card box">
    <h1>自動売買</h1>
    <div class="sub">LIVE ACCOUNT</div>
    <input type="password" id="gatePassword" placeholder="パスワード" autocomplete="off">
    <button onclick="checkGatePassword()">開く</button>
    <div class="err" id="gateError"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1>自動売買</h1>
      <span class="pill" id="livePill"><span class="dot"></span><span id="livePillText">LIVE</span></span>
    </div>
    <div class="actions">
      <button class="ibtn" id="btnRefresh" title="更新" onclick="load()"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
      <button class="ibtn" title="戻る" onclick="backToHub()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="ibtn" title="ログアウト" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </div>
  <div class="meta"><span id="updated">読み込み中…</span><span id="fxNote"></span></div>

  <div id="banners"></div>

  <div class="card hero">
    <div class="label">純資産 / Net Liquidation</div>
    <div class="big" id="netLiq">—</div>
    <div class="chips" id="heroChips"></div>
    <div class="chart" id="chartWrap">
      <svg id="eqChart" viewBox="0 0 640 190" aria-label="純資産の推移"></svg>
      <div class="tip" id="eqTip"></div>
    </div>
    <div class="range" id="rangeBtns"></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <section>
    <div class="sec-h"><h2>保有中</h2><div class="sort" id="posSort"></div></div>
    <div class="pos-grid" id="positions"></div>
  </section>

  <section>
    <div class="sec-h"><h2>発注中の指値</h2><span class="n" id="pendN"></span></div>
    <div id="pending"></div>
  </section>

  <section>
    <details class="fold" open>
      <summary><div class="sec-h"><h2>約定履歴</h2><span class="n" id="fillN"></span></div></summary>
      <div id="fills"></div>
    </details>
  </section>

  <footer>
    このページは IBKR 本番口座の実績だけを表示しています(台帳・検証データは含みません)。<br>
    <a href="ledger.html">シグナル台帳(検証データ)を見る</a>
  </footer>
</div>

<script>
// ---------- ゲート(従来と同じパスワード・同じ保存キー) ----------
const GATE_PASSWORD_HASH = 'e1d90e17f51e8f74ead2086eed13b926a67ae8450ce12f3a488aa7d40b4f1157';
const GATE_STORAGE_KEY = 'gateOk_v1';
const HUB_URL = 'https://mohimohi111.github.io/stock-signal-hub/';
async function sha256Hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function openApp() { document.getElementById('gate').style.display = 'none'; document.getElementById('app').style.display = 'block'; }
async function checkGatePassword() {
  const el = document.getElementById('gatePassword');
  if (await sha256Hex(el.value) === GATE_PASSWORD_HASH) {
    try { localStorage.setItem(GATE_STORAGE_KEY, '1'); } catch (e) {}
    openApp();
  } else { document.getElementById('gateError').textContent = 'パスワードが違います'; }
}
document.getElementById('gatePassword').addEventListener('keydown', e => { if (e.key === 'Enter') checkGatePassword(); });
try { if (localStorage.getItem(GATE_STORAGE_KEY) === '1') openApp(); } catch (e) {}
function backToHub() {
  if (window.self !== window.top && window.parent && typeof window.parent.closeFrame === 'function') window.parent.closeFrame();
  else window.location.href = HUB_URL;
}
function logout() {
  try { localStorage.removeItem(GATE_STORAGE_KEY); } catch (e) {}
  document.getElementById('gatePassword').value = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'flex';
  if (window.self !== window.top && window.parent && typeof window.parent.logoutHub === 'function') window.parent.logoutHub();
  else window.location.href = HUB_URL;
}

// ---------- 書式 ----------
const jpy = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const jpyS = n => (n >= 0 ? '+' : '-') + '¥' + Math.round(Math.abs(n)).toLocaleString('ja-JP');
const usd = n => '$' + Math.round(n).toLocaleString('en-US');
const usdS = n => (n >= 0 ? '+' : '-') + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const px = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = n => (n >= 0 ? '+' : '') + Number(n).toFixed(2) + '%';
const pct1 = n => (n >= 0 ? '+' : '') + Number(n).toFixed(1) + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MODE_CSS = { 'MODE A': 'a', 'MODE B': 'b', 'MODE C': 'c' };
const modeChips = ms => (ms && ms.length) ? `<span class="modes">${ms.map(m => `<span class="mode ${MODE_CSS[m] || ''}">${esc(m.replace('MODE ', ''))}</span>`).join('')}</span>` : '';

// ---------- 読み込み ----------
let LIVE = null;
let posSortKey = 'pct';
let rangeKey = 'ALL';
async function load() {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('spin');
  document.getElementById('updated').textContent = '更新中…';
  try {
    const r = await fetch('../live.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    LIVE = await r.json();
    render(LIVE);
  } catch (e) {
    document.getElementById('updated').textContent = '取得に失敗しました。時間をおいて再試行してください。';
  } finally {
    btn.classList.remove('spin');
  }
}

function render(live) {
  const a = live.account || {};
  const fx = a.usdjpy || 0;
  const hist = (live.equity_history || []).slice().sort((p, q) => p.date.localeCompare(q.date));

  document.getElementById('updated').textContent = '最終更新 ' + (live.updated_jst || '-') + (live.updated_et ? '(' + live.updated_et + ')' : '');
  document.getElementById('fxNote').textContent = fx ? 'USD/JPY ' + fx.toFixed(2) : '';

  const pill = document.getElementById('livePill');
  pill.className = 'pill ' + (live.connected ? 'on' : 'off');
  document.getElementById('livePillText').textContent = live.connected ? 'LIVE' : 'OFFLINE';

  // バナー
  const banners = [];
  if (!live.connected) banners.push(`<div class="banner err">🔴 ${esc(live.error || '本番口座に接続できていません')}${live.last_attempt_jst ? '(' + esc(live.last_attempt_jst) + ')' : ''}<span class="sub">下の内容は最後に接続できた時点のものです</span></div>`);
  if ((live.unprotected || []).length) banners.push(`<div class="banner err">🛑 損切り注文が無い保有: ${live.unprotected.map(esc).join(', ')}</div>`);
  if ((live.alerts || []).length) banners.push(`<div class="banner warn">⚠️ 要確認 ${live.alerts.length}件<span class="sub">${live.alerts.map(esc).join('<br>')}</span></div>`);
  document.getElementById('banners').innerHTML = banners.join('');

  // ヒーロー
  const net = a.net_liq_jpy;
  document.getElementById('netLiq').innerHTML = net != null ? `<span class="cur">¥</span>${Math.round(net).toLocaleString('ja-JP')}` : '—';
  const chips = [];
  if (hist.length >= 2) {
    const prev = hist[hist.length - 2].net_liq_jpy, last = hist[hist.length - 1].net_liq_jpy;
    const d = last - prev;
    chips.push(`<span class="chip ${d >= 0 ? 'up' : 'down'}"><small>前日比</small>${jpyS(d)} (${pct(d / prev * 100)})</span>`);
    const w = hist.filter(h => h.date >= addDays(hist[hist.length - 1].date, -7));
    if (w.length >= 2) { const dw = last - w[0].net_liq_jpy; chips.push(`<span class="chip ${dw >= 0 ? 'up' : 'down'}"><small>1週間</small>${jpyS(dw)} (${pct(dw / w[0].net_liq_jpy * 100)})</span>`); }
    const d0 = last - hist[0].net_liq_jpy;
    chips.push(`<span class="chip ${d0 >= 0 ? 'up' : 'down'}"><small>${hist[0].date.slice(5).replace('-', '/')}〜</small>${jpyS(d0)}</span>`);
    chips.push(`<span class="chip" style="font-family:var(--sans);font-weight:500;color:var(--muted)">※入出金・為替を含む純資産の変化</span>`);
  }
  document.getElementById('heroChips').innerHTML = chips.join('');
  renderRangeButtons(hist);
  renderChart(hist);

  // KPI
  const u = a.unrealized_usd || 0, rz = a.realized_usd;
  const posN = (live.positions || []).length, pendN = (live.pending || []).length;
  const kp = [
    { l: '含み損益', v: usdS(u), c: u >= 0 ? 'up' : 'down', s: `${a.unrealized_pct != null ? pct(a.unrealized_pct) : ''}${fx ? ' / ' + jpyS(u * fx) : ''}` },
    { l: '確定損益(記録分)', v: rz != null ? usdS(rz) : '—', c: (rz || 0) >= 0 ? 'up' : 'down', s: rz != null ? `${a.realized_count || 0}件${fx ? ' / ' + jpyS(rz * fx) : ''}` : '' },
    { l: '現金', v: a.cash_jpy != null ? jpy(a.cash_jpy) : '—', c: '', s: `指値拘束 ${usd(a.pending_total_usd || 0)}` },
    { l: '保有 / 指値待ち', v: `${posN} / ${pendN}`, c: '', s: (live.unprotected || []).length ? '⚠️ 損切り未設定あり' : (posN ? '全銘柄に損切りあり' : '') },
  ];
  document.getElementById('kpis').innerHTML = kp.map((k, i) => `<div class="card kpi" style="animation-delay:${0.05 + i * 0.04}s"><div class="label">${k.l}</div><div class="val ${k.c}">${k.v}</div><div class="sub">${k.s}</div></div>`).join('');

  renderPositions(live);
  renderPending(live);
  renderFills(live);
}

function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

// ---------- 純資産チャート ----------
function renderRangeButtons(hist) {
  const opts = [['1M', 31], ['3M', 92], ['ALL', 99999]];
  document.getElementById('rangeBtns').innerHTML = hist.length >= 2 ? opts.map(([k, n]) =>
    `<button class="${rangeKey === k ? 'on' : ''}" onclick="rangeKey='${k}';render(LIVE)">${k}</button>`).join('') : '';
}
function renderChart(histAll) {
  const svg = document.getElementById('eqChart'), tip = document.getElementById('eqTip');
  const days = { '1M': 31, '3M': 92, 'ALL': 99999 }[rangeKey] || 99999;
  const hist = histAll.length ? histAll.filter(h => h.date >= addDays(histAll[histAll.length - 1].date, -days)) : [];
  if (hist.length < 2) { svg.innerHTML = '<text class="axis" x="320" y="95" text-anchor="middle">推移はデータが2日分以上たまると表示されます</text>'; return; }
  const W = 640, H = 190, L = 58, R = 14, T = 14, B = 26;
  const vals = hist.map(h => h.net_liq_jpy);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padV = (hi - lo) * 0.12 || hi * 0.01; lo -= padV; hi += padV;
  const n = hist.length;
  const X = i => L + (i / (n - 1)) * (W - L - R);
  const Y = v => H - B - ((v - lo) / (hi - lo)) * (H - T - B);
  // smooth path (monotone cubic-ish via simple catmull-rom)
  const pts = hist.map((h, i) => [X(i), Y(h.net_liq_jpy)]);
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const area = d + ` L ${X(n - 1).toFixed(1)} ${(H - B).toFixed(1)} L ${X(0).toFixed(1)} ${(H - B).toFixed(1)} Z`;
  const ticks = 3;
  let grid = '';
  for (let k = 0; k <= ticks; k++) {
    const v = lo + (hi - lo) * k / ticks;
    grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="axis" x="${L - 8}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${(v / 10000).toFixed(0)}万</text>`;
  }
  const step = Math.max(1, Math.round(n / 5));
  let xl = '';
  for (let i = 0; i < n; i += step) xl += `<text class="axis" x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${hist[i].date.slice(5).replace('-', '/')}</text>`;
  const lx = X(n - 1).toFixed(1), ly = Y(vals[n - 1]).toFixed(1);
  svg.innerHTML = `
    <defs><linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--profit)" stop-opacity="0.35"/><stop offset="100%" stop-color="var(--profit)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path class="area" d="${area}"/><path class="line" d="${d}"/>
    <line class="cursor" id="eqCursor" x1="0" x2="0" y1="${T}" y2="${H - B}" style="opacity:0"/>
    <circle class="last-halo" cx="${lx}" cy="${ly}" r="5"/><circle class="last" cx="${lx}" cy="${ly}" r="4.5"/>${xl}`;
  const cursor = svg.querySelector('#eqCursor');
  const show = (clientX, clientY) => {
    const rect = svg.getBoundingClientRect();
    const sx = (clientX - rect.left) / rect.width * W;
    let i = Math.round((sx - L) / (W - L - R) * (n - 1)); i = Math.max(0, Math.min(n - 1, i));
    const h = hist[i];
    cursor.setAttribute('x1', X(i)); cursor.setAttribute('x2', X(i)); cursor.style.opacity = 1;
    tip.style.opacity = 1; tip.style.left = (X(i) / W * rect.width) + 'px'; tip.style.top = (Y(h.net_liq_jpy) / H * rect.height) + 'px';
    const prev = hist[i - 1];
    tip.textContent = `${h.date}  ${jpy(h.net_liq_jpy)}` + (prev ? `  (${jpyS(h.net_liq_jpy - prev.net_liq_jpy)})` : '');
  };
  svg.onmousemove = e => show(e.clientX, e.clientY);
  svg.ontouchstart = svg.ontouchmove = e => { const t = e.touches[0]; if (t) show(t.clientX, t.clientY); };
  svg.onmouseleave = svg.ontouchend = () => { tip.style.opacity = 0; cursor.style.opacity = 0; };
}

// ---------- 保有 ----------
function renderPositions(live) {
  const ps = (live.positions || []).slice();
  const sorts = { pct: ['損益%', (a, b) => (b.unrealized_pct || 0) - (a.unrealized_pct || 0)],
                  usd: ['損益$', (a, b) => (b.unrealized_usd || 0) - (a.unrealized_usd || 0)],
                  sl:  ['損切り近', (a, b) => Math.abs(a.sl_gap_pct ?? 99) - Math.abs(b.sl_gap_pct ?? 99)],
                  sym: ['銘柄', (a, b) => a.code.localeCompare(b.code)] };
  document.getElementById('posSort').innerHTML = Object.entries(sorts).map(([k, [l]]) => `<button class="${posSortKey === k ? 'on' : ''}" onclick="posSortKey='${k}';renderPositions(LIVE)">${l}</button>`).join('');
  ps.sort(sorts[posSortKey][1]);
  const el = document.getElementById('positions');
  if (!ps.length) { el.innerHTML = '<div class="card empty">保有はありません。</div>'; return; }
  el.innerHTML = ps.map((p, i) => {
    const up = (p.unrealized_pct || 0) >= 0;
    const last = p.last_price, cost = p.avg_cost, sl = p.sl;
    const vals = [cost, last, sl].filter(v => v != null);
    const lo = Math.min(...vals) * 0.985, hi = Math.max(...vals) * 1.015;
    const pos = v => ((v - lo) / (hi - lo) * 100).toFixed(1) + '%';
    const value = (last || cost) * p.qty;
    return `
    <div class="card pos ${up ? 'up' : 'down'}" style="animation-delay:${0.08 + i * 0.03}s">
      <div class="pos-top">
        <div><div class="sym">${esc(p.code)}${modeChips(p.modes)}</div><div class="nm">${esc(p.name)}${p.entered_date ? ' · ' + esc(p.entered_date.slice(5).replace('-', '/')) + '〜' : ''}</div></div>
        <div class="pnl"><div class="pct ${up ? 'up' : 'down'}">${p.unrealized_pct != null ? pct(p.unrealized_pct) : '—'}</div><div class="usd">${usdS(p.unrealized_usd || 0)}</div></div>
      </div>
      <div class="track">
        ${sl != null ? `<span class="m sl" style="left:${pos(sl)}" title="損切り"></span>` : ''}
        <span class="m cost" style="left:${pos(cost)}" title="取得単価"></span>
        ${last != null ? `<span class="m last ${up ? '' : 'neg'}" style="left:${pos(last)}" title="現在値"></span>` : ''}
      </div>
      <div class="trk-lbl"><span>SL <b class="${sl == null ? 'warn-sl' : ''}">${sl != null ? px(sl) : 'なし'}</b>${p.sl_gap_pct != null ? ` <span>(${Math.abs(p.sl_gap_pct).toFixed(1)}%下)</span>` : ''}</span><span>取得 <b>${px(cost)}</b></span><span>現在 <b>${last != null ? px(last) : '—'}</b></span></div>
      <div class="facts">
        <div><div class="k">株数</div><div class="v">${p.qty}株</div></div>
        <div><div class="k">評価額</div><div class="v">${usd(value)}</div></div>
        <div><div class="k">取得額</div><div class="v">${usd(cost * p.qty)}</div></div>
      </div>
    </div>`;
  }).join('');
}

// ---------- 指値 ----------
function renderPending(live) {
  const os = (live.pending || []).slice().sort((a, b) => (a.gap_pct ?? 999) - (b.gap_pct ?? 999));
  document.getElementById('pendN').textContent = os.length ? `${os.length}件 / ${usd(os.reduce((s, o) => s + o.limit * o.qty, 0))}` : '';
  const el = document.getElementById('pending');
  if (!os.length) { el.innerHTML = '<div class="card empty">発注中の指値はありません。</div>'; return; }
  el.innerHTML = os.map((o, i) => {
    const g = o.gap_pct;  // 現在値が指値よりどれだけ上か(0で到達)
    const prog = g == null ? 0 : Math.max(4, Math.min(100, 100 - g * 4));  // 25%上=0, 到達=100
    return `
    <div class="card ord" style="animation-delay:${0.1 + i * 0.03}s">
      <div><div class="sym" style="font-size:16px">${esc(o.code)}${modeChips([o.mode])}</div><div class="nm">${esc(o.name)}</div></div>
      <div class="gap ${g != null && g <= 2 ? 'up' : ''}">${g != null ? pct1(g) : '—'}<small>指値まで</small></div>
      <div class="bar"><i style="width:${prog}%"></i></div>
      <div class="line"><span>指値 <b>${px(o.limit)}</b></span><span>現在 <b>${o.last_price != null ? px(o.last_price) : '—'}</b></span><span>SL <b>${o.sl != null ? px(o.sl) : '—'}</b></span><span>${o.qty}株 <b>${usd(o.limit * o.qty)}</b></span></div>
    </div>`;
  }).join('');
}

// ---------- 約定 ----------
function renderFills(live) {
  const fs = (live.fills || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  document.getElementById('fillN').textContent = fs.length ? `${fs.length}件` : '';
  const el = document.getElementById('fills');
  if (!fs.length) { el.innerHTML = '<div class="card empty">記録された約定はまだありません。</div>'; return; }
  let out = '', curDay = '';
  fs.forEach((f, i) => {
    if (f.date !== curDay) { curDay = f.date; out += `<div class="day">${esc(f.date)}</div>`; }
    const buy = f.side === 'BUY';
    const cls = buy ? 'buy' : (f.pnl_usd != null && f.pnl_usd >= 0 ? 'win' : 'lose');
    const lbl = buy ? '買' : (f.kind === '利確' ? '利確' : f.kind === '損切り' ? '損切' : '売');
    const right = f.pnl_usd != null
      ? `<div class="p ${f.pnl_usd >= 0 ? 'up' : 'down'}">${usdS(f.pnl_usd)}</div><div class="s">${pct(f.pnl_pct)} · 取得 ${px(f.avg_cost)}</div>`
      : `<div class="p">${px(f.price)}</div><div class="s">${f.qty}株 · ${usd(f.price * f.qty)}</div>`;
    out += `
    <div class="card fill" style="animation-delay:${0.12 + i * 0.02}s">
      <div class="ic ${cls}">${lbl}</div>
      <div class="body"><div class="t">${esc(f.code)}<span class="nm2">${esc(f.name || '')}</span></div><div class="d">${f.qty}株 @ ${px(f.price)}</div></div>
      <div class="r">${right}</div>
    </div>`;
  });
  el.innerHTML = out;
}

load();

// ---------- PWA ----------
if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; window.location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reg.update(); if (LIVE) load(); } });
  });
}

// ---------- 稲光 ----------
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const sky = document.getElementById('sky'), bolt = sky.querySelector('.bolt');
  const flash = () => {
    bolt.style.setProperty('--bx', (15 + Math.random() * 70).toFixed(0) + '%');
    bolt.style.setProperty('--by', (Math.random() * 30).toFixed(0) + '%');
    bolt.style.setProperty('--bi', (0.35 + Math.random() * 0.3).toFixed(2));
    bolt.style.setProperty('--bdur', (350 + Math.random() * 400).toFixed(0) + 'ms');
    sky.classList.remove('flash'); void sky.offsetWidth; sky.classList.add('flash');
  };
  const sched = () => { flash(); if (Math.random() < 0.35) setTimeout(flash, 120 + Math.random() * 200);
    setTimeout(sched, Math.random() < 0.25 ? 2000 + Math.random() * 3000 : 6000 + Math.random() * 18000); };
  setTimeout(sched, 1500 + Math.random() * 3000);
}
</script>
